# =====================================================================
# Mapping rules: ASN (Advance Shipment Notice)
# Source: MongoDB collection "asns"
# Targets: PostgreSQL (relational) and Neo4j (property graph)
# =====================================================================

document_type: ASN
source_collection: asns
source_key_field: asn_number

# ---------------------------------------------------------------------
# PostgreSQL mapping
# ---------------------------------------------------------------------
postgresql:
  parent_table:
    name: asns
    primary_key: asn_number
    columns:
      - { source_field: asn_number,        column: asn_number,        type: VARCHAR(20) }
      - { source_field: po_number,         column: po_number,         type: VARCHAR(20), foreign_key: purchase_orders.po_number }
      - { source_field: vendor_id,         column: vendor_id,         type: VARCHAR(20) }
      - { source_field: ship_date,         column: ship_date,         type: DATE }
      - { source_field: carrier,           column: carrier,           type: VARCHAR(60) }
      - { source_field: tracking_number,   column: tracking_number,   type: VARCHAR(40) }
      - { source_field: expected_arrival,  column: expected_arrival,  type: DATE }
      - { source_field: status,            column: status,            type: VARCHAR(20) }
      - { source_field: updated_at,        column: source_updated_at, type: TIMESTAMPTZ }

  child_tables:
    - name: asn_line_items
      source_array_field: line_items
      foreign_key: { column: asn_number, references: asns.asn_number, on_delete: CASCADE }
      upsert_key: [asn_number, line_no]
      columns:
        - { source_field: line_no,           column: line_no,          type: INTEGER }
        - { source_field: material_code,     column: material_code,    type: VARCHAR(20) }
        - { source_field: quantity_shipped,  column: quantity_shipped, type: NUMERIC(12,2) }
        - { source_field: unit_of_measure,    column: uom,               type: VARCHAR(10) }

  write_mode: UPSERT
  delete_mode: HARD_DELETE_CASCADE

# ---------------------------------------------------------------------
# Neo4j mapping
# ---------------------------------------------------------------------
neo4j:
  node:
    label: ASN
    key_property: asn_number
    properties:
      - { source_field: asn_number,        property: asn_number }
      - { source_field: ship_date,         property: ship_date }
      - { source_field: carrier,           property: carrier }
      - { source_field: tracking_number,   property: tracking_number }
      - { source_field: expected_arrival,  property: expected_arrival }
      - { source_field: status,            property: status }
    merge_cypher: |
      MERGE (a:ASN {asn_number: $asn_number})
      SET a.ship_date        = $ship_date,
          a.carrier           = $carrier,
          a.tracking_number   = $tracking_number,
          a.expected_arrival  = $expected_arrival,
          a.status            = $status

  relationships:
    - type: FULFILLS
      direction: (ASN)-[:FULFILLS]->(PurchaseOrder)
      source_field: po_number
      target_node: { label: PurchaseOrder, key_property: po_number, source_key_field: po_number }
      merge_cypher: |
        MATCH (a:ASN {asn_number: $asn_number})
        MATCH (p:PurchaseOrder {po_number: $po_number})
        MERGE (a)-[:FULFILLS]->(p)

    - type: SHIPS
      direction: (ASN)-[:SHIPS]->(Material)
      source_array_field: line_items
      target_node: { label: Material, key_property: material_code, source_key_field: material_code }
      relationship_properties:
        - { source_field: quantity_shipped, property: quantity_shipped }
      merge_cypher: |
        MATCH (a:ASN {asn_number: $asn_number})
        MERGE (m:Material {material_code: $material_code})
        MERGE (a)-[s:SHIPS]->(m)
        SET s.quantity_shipped = $quantity_shipped

  delete_mode: DETACH_DELETE
